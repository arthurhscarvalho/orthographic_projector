[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "orthographic_projector"
version = "0.2.2"
description = "Generate orthographic projections from a Point Cloud."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python>=4.9", "toml>=0.10.0"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Rust",
]

[project.urls]
repository = "https://github.com/arthurhscarvalho/orthographic_projector"

[dependency-groups]
dev = [
    "maturin>=1.8.3,<2.0",
    "patchelf>=0.17.2.1; sys_platform == 'linux'",
]
examples = [
    # Retain Intel macOS wheels and the lower Linux glibc requirement.
    "open3d>=0.19.0,<0.20",
    # Open3D 0.19 omits this Linux/Windows requirement from its macOS metadata.
    "ipywidgets>=8.0.4; sys_platform == 'linux' or sys_platform == 'win32'",
]

[tool.uv.dependency-groups]
examples = { requires-python = ">=3.10,<3.13" }
